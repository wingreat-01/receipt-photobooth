<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Receipt Photo Booth</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --accent:#ffd447; --text:#f4f4f2; --muted:#8a8a92; --danger:#ff5c5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:'Courier New',monospace; user-select:none;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  header{padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #232327;}
  header .title{font-weight:700; letter-spacing:2px; font-size:14px; color:var(--muted);}
  #status{font-size:12px; padding:4px 10px; border-radius:20px; background:#222; color:var(--muted);}
  #status.ok{color:#0b0b0d; background:#68e07a;}
  #status.bad{color:#0b0b0d; background:var(--danger);}
  main{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  video, #snapCanvas{width:100%; height:100%; object-fit:cover; display:block;}
  #snapCanvas{display:none; position:absolute; inset:0;}
  #countdown{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:40vw; font-weight:900; color:#fff; text-shadow:0 0 40px #000; pointer-events:none;}
  #flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;}
  footer{padding:20px; display:flex; gap:14px; justify-content:center; align-items:center;
    border-top:1px solid #232327; background:var(--panel);}
  button{font-family:inherit; border:none; border-radius:14px; padding:18px 26px; font-size:18px;
    font-weight:700; cursor:pointer; letter-spacing:.5px;}
  .primary{background:var(--accent); color:#1a1a00; flex:1; max-width:420px;}
  .primary:disabled{opacity:.4;}
  .ghost{background:#232327; color:var(--text);}
  .danger{background:var(--danger); color:#1a0000;}
  #setupOverlay{position:absolute; inset:0; background:#000d; display:flex; align-items:center;
    justify-content:center; z-index:20; flex-direction:column; gap:16px; padding:24px; text-align:center;}
  #setupOverlay p{color:var(--muted); max-width:480px; line-height:1.5; font-size:14px;}
  .hidden{display:none !important;}

  #layoutOverlay{position:absolute;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:25;padding:18px;overflow:auto}
  #layoutOverlay.show{display:flex}
  .layoutPanel{width:min(760px,96vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #303036;border-radius:18px;padding:20px}
  .layoutTitle{font-size:20px;font-weight:700;margin-bottom:4px}
  .layoutSub{font-size:12px;color:var(--muted);margin-bottom:16px}

  .nameField{margin-bottom:16px}
  .nameField label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px}
  .nameField input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #303036;
    background:#1c1c20;color:var(--text);font-family:inherit;font-size:16px;}
  .nameField input:focus{outline:2px solid var(--accent);}

  .layoutGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .layoutCard{background:#202024;color:var(--text);border:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer;text-align:center}
  .layoutCard.selected{border-color:var(--accent);background:#29291f}
  .layoutThumb{height:150px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
  .layoutThumb canvas{max-width:100%;max-height:100%;width:auto;height:auto}
  .layoutName{font-size:13px;font-weight:700}
  .layoutActions{display:flex;gap:12px;justify-content:flex-end;margin-top:16px}
  .layoutActions button{flex:1;max-width:260px}
  @media(max-width:650px){.layoutGrid{grid-template-columns:repeat(2,1fr)}.layoutThumb{height:135px}.layoutPanel{padding:15px}}

  #toast{position:absolute; bottom:110px; left:50%; transform:translateX(-50%); background:#000c;
    color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:30; display:none;}
</style>
</head>
<body>

<!-- Real, scannable CODE128 barcode rendering (self-hosted copy recommended for
     offline reliability — see the note at the bottom of the chat reply). -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.code128.min.js"></script>

<div id="app">
  <header>
    <div class="title">RECEIPT BOOTH</div>
    <div id="status">printer: not connected</div>
  </header>

  <main>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="snapCanvas"></canvas>
    <div id="countdown"></div>
    <div id="flash"></div>
  </main>

  <footer>
    <button class="ghost" id="connectBtn">Connect Printer</button>
    <button class="primary" id="mainBtn">TAKE PHOTO</button>
    <button class="ghost hidden" id="retakeBtn">Retake</button>
  </footer>


  <div id="layoutOverlay">
    <div class="layoutPanel">
      <div class="layoutTitle">Choose Print Layout</div>
      <div class="layoutSub">Select how your photo will appear on the 80 mm thermal print.</div>

      <div class="nameField">
        <label for="guestName">Your name (optional — printed on the receipt)</label>
        <input type="text" id="guestName" maxlength="24" placeholder="e.g. Alex">
      </div>

      <div class="layoutGrid">
        <button class="layoutCard selected" data-layout="portrait"><div class="layoutThumb"><canvas id="thumbPortrait"></canvas></div><div class="layoutName">Portrait</div></button>
        <button class="layoutCard" data-layout="strip"><div class="layoutThumb"><canvas id="thumbStrip"></canvas></div><div class="layoutName">Photo Strip</div></button>
        <button class="layoutCard" data-layout="receipt"><div class="layoutThumb"><canvas id="thumbReceipt"></canvas></div><div class="layoutName">Receipt Style</div></button>
        <button class="layoutCard" data-layout="minimal"><div class="layoutThumb"><canvas id="thumbMinimal"></canvas></div><div class="layoutName">Minimal</div></button>
      </div>
      <div class="layoutActions">
        <button class="ghost" id="layoutRetakeBtn">Retake</button>
        <button class="primary" id="layoutPrintBtn">PRINT</button>
      </div>
    </div>
  </div>

  <div id="setupOverlay">
    <div style="font-size:22px; font-weight:700;">Receipt Photo Booth</div>
    <p>1. Allow camera access.<br>2. Tap "Connect Printer" and pick your Bluetooth thermal printer.<br>
       3. Tap the big button, smile, and your photo prints like a receipt.</p>
    <button class="primary" id="startBtn">Start Camera</button>
  </div>
  <div id="toast"></div>
</div>

<script>
/* ============================================================
   CONFIG — adjust these two UUIDs to match your printer model.
   Many cheap ESC/POS Bluetooth thermal printers expose a generic
   "Serial Port Profile"-style GATT service. Common defaults below
   work for many clone printers (e.g. "Goojprt", "MPT-II" clones).
   If connection succeeds but nothing prints, use a BLE scanner
   app once to find your printer's real service/characteristic
   UUIDs and paste them here.
   ============================================================ */
const PRINTER_SERVICE_UUID        = 0x18F0; // generic serial service
const PRINTER_CHARACTERISTIC_UUID = 0x2AF1; // generic write characteristic
const PRINTER_WIDTH_DOTS = 576; // typical 80mm printer at 203dpi
const PRINTER_WIDTH_BYTES = PRINTER_WIDTH_DOTS / 8;

let bleDevice = null, bleChar = null;
let stream = null;
let lastShot = null; // {canvas}

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const toastEl = $('toast');

function toast(msg, ms=2200){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toastEl.style.display='none', ms);
}

/* ---------------- Receipt numbering ---------------- */
// Persists across reloads on this device, so the kiosk hands out
// sequential-looking "order numbers" all night, e.g. #000042.
function nextReceiptNumber(){
  let n = parseInt(localStorage.getItem('receiptCounter') || '0', 10);
  n += 1;
  localStorage.setItem('receiptCounter', String(n));
  return n;
}
function peekReceiptNumber(){
  // used only for live thumbnail previews, does not consume a number
  return (parseInt(localStorage.getItem('receiptCounter') || '0', 10) + 1);
}

/* ---------------- Barcode ---------------- */
// Renders a real, scannable CODE128 barcode onto an offscreen canvas
// using the JsBarcode library loaded above.
function drawBarcode(value){
  const bc = document.createElement('canvas');
  try{
    JsBarcode(bc, value, {
      format: 'CODE128',
      displayValue: false,
      width: 2,
      height: 54,
      margin: 0,
      background: '#ffffff',
      lineColor: '#000000'
    });
  }catch(e){
    // Fails gracefully (e.g. JsBarcode not loaded — no internet on first
    // load) by leaving a small blank canvas instead of breaking the print.
    bc.width = 300; bc.height = 54;
  }
  return bc;
}

/* ---------------- Camera ---------------- */
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width:{ideal:1280}, height:{ideal:960} },
      audio: false
    });
    $('video').srcObject = stream;
    $('setupOverlay').classList.add('hidden');
  }catch(e){
    toast('Camera error: ' + e.message, 4000);
  }
}
$('startBtn').onclick = startCamera;

/* ---------------- Bluetooth printer ---------------- */
async function connectPrinter(){
  try{
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [PRINTER_SERVICE_UUID] }],
      optionalServices: [PRINTER_SERVICE_UUID]
    });
    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(PRINTER_SERVICE_UUID);
    bleChar = await service.getCharacteristic(PRINTER_CHARACTERISTIC_UUID);
    statusEl.textContent = 'printer: ' + bleDevice.name;
    statusEl.className = 'ok';
    bleDevice.addEventListener('gattserverdisconnected', () => {
      statusEl.textContent = 'printer: disconnected';
      statusEl.className = 'bad';
      bleChar = null;
    });
    toast('Printer connected');
  }catch(e){
    statusEl.textContent = 'printer: connect failed';
    statusEl.className = 'bad';
    toast('Bluetooth error: ' + e.message, 4000);
  }
}
$('connectBtn').onclick = connectPrinter;

// Write bytes to printer in safe chunks (BLE has ~180-byte MTU limits typically)
async function printerWrite(bytes){
  if(!bleChar) throw new Error('Printer not connected');
  const CHUNK = 180;
  for(let i=0; i<bytes.length; i+=CHUNK){
    const slice = bytes.slice(i, i+CHUNK);
    await bleChar.writeValueWithoutResponse(new Uint8Array(slice));
    await new Promise(r=>setTimeout(r, 12)); // pace writes so the printer buffer keeps up
  }
}

/* ---------------- ESC/POS helpers ---------------- */
function escposInit(){ return [0x1B,0x40]; } // ESC @
function escposFeed(n){ return [0x1B,0x64,n]; } // ESC d n
function escposCut(){ return [0x1D,0x56,0x00]; } // GS V 0 (full cut, if supported)
function textToBytes(str){ return Array.from(str).map(c=>c.charCodeAt(0)); }
function escposAlignCenter(){ return [0x1B,0x61,0x01]; }
function escposAlignLeft(){ return [0x1B,0x61,0x00]; }
function escposBoldOn(){ return [0x1B,0x45,0x01]; }
function escposBoldOff(){ return [0x1B,0x45,0x00]; }

// GS v 0: print raster bitmap. widthBytes*8 = dots wide, heightDots = rows.
function escposRasterHeader(widthBytes, heightDots){
  const xL = widthBytes & 0xFF, xH = (widthBytes>>8) & 0xFF;
  const yL = heightDots & 0xFF, yH = (heightDots>>8) & 0xFF;
  return [0x1D,0x76,0x30,0x00, xL,xH, yL,yH];
}

/* ---------------- Image processing ---------------- */
// Crop/resize source canvas to printer width, grayscale, then
// Floyd–Steinberg dither to 1-bit for crisp thermal output.
function prepareReceiptImage(sourceCanvas, targetWidth){
  const scale = targetWidth / sourceCanvas.width;
  const targetHeight = Math.round(sourceCanvas.height * scale);

  const c = document.createElement('canvas');
  c.width = targetWidth; c.height = targetHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(sourceCanvas, 0,0, targetWidth, targetHeight);

  const imgData = ctx.getImageData(0,0,targetWidth,targetHeight);
  const gray = new Float32Array(targetWidth*targetHeight);
  for(let i=0;i<targetWidth*targetHeight;i++){
    const r=imgData.data[i*4], g=imgData.data[i*4+1], b=imgData.data[i*4+2];
    gray[i] = 0.299*r + 0.587*g + 0.114*b;
  }
  // Floyd-Steinberg dithering
  for(let y=0;y<targetHeight;y++){
    for(let x=0;x<targetWidth;x++){
      const idx = y*targetWidth+x;
      const old = gray[idx];
      const nw = old < 128 ? 0 : 255;
      const err = old - nw;
      gray[idx] = nw;
      if(x+1<targetWidth) gray[idx+1] += err*7/16;
      if(y+1<targetHeight){
        if(x>0) gray[idx+targetWidth-1] += err*3/16;
        gray[idx+targetWidth] += err*5/16;
        if(x+1<targetWidth) gray[idx+targetWidth+1] += err*1/16;
      }
    }
  }
  return { width:targetWidth, height:targetHeight, gray };
}

function ditheredToEscposBytes(dithered, widthBytes){
  const {width,height,gray} = dithered;
  const bytes = new Uint8Array(widthBytes*height);
  for(let y=0;y<height;y++){
    for(let xByte=0; xByte<widthBytes; xByte++){
      let b=0;
      for(let bit=0; bit<8; bit++){
        const x = xByte*8+bit;
        const val = x<width ? gray[y*width+x] : 255;
        if(val < 128) b |= (0x80 >> bit); // black pixel = 1
      }
      bytes[y*widthBytes+xByte] = b;
    }
  }
  return Array.from(bytes);
}

/* ---------------- Capture + layout + print flow ---------------- */
const mainBtn = $('mainBtn');
const retakeBtn = $('retakeBtn');
const layoutOverlay = $('layoutOverlay');
const layoutPrintBtn = $('layoutPrintBtn');
const layoutRetakeBtn = $('layoutRetakeBtn');
const guestNameInput = $('guestName');
let selectedLayout = 'portrait';

function showLayoutChooser(){
  if(!lastShot) return;
  selectedLayout='portrait';
  guestNameInput.value = '';
  document.querySelectorAll('.layoutCard').forEach(c=>c.classList.toggle('selected',c.dataset.layout===selectedLayout));
  drawLayoutThumbs();
  layoutOverlay.classList.add('show');
}
function hideLayoutChooser(){layoutOverlay.classList.remove('show');}

function drawFitImage(ctx,source,x,y,w,h){
  const sr=source.width/source.height, br=w/h;
  let dw,dh;
  if(sr>br){dh=h;dw=h*sr}else{dw=w;dh=w/sr}
  ctx.drawImage(source,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}

// Draws the personalized name line + order number + scannable
// barcode as a shared footer block, used by every layout. Returns
// the height it consumed so callers can size their canvas.
function drawReceiptFooter(ctx, W, y, receiptNo, guestName){
  const margin = 24;
  let cy = y;

  if (guestName) {
    ctx.font = 'bold 22px Arial';
    ctx.fillText('FOR: ' + guestName.toUpperCase(), W/2, cy + 22);
    cy += 34;
  }

  ctx.font = '16px Arial';
  const orderStr = 'ORDER NO. ' + String(receiptNo).padStart(6,'0');
  ctx.fillText(orderStr, W/2, cy + 16);
  cy += 26;

  const barcodeValue = String(receiptNo).padStart(6,'0');
  const bcCanvas = drawBarcode(barcodeValue);
  const bcDrawWidth = Math.min(W - margin*2, 320);
  const bcDrawHeight = bcCanvas.height * (bcDrawWidth / bcCanvas.width);
  ctx.drawImage(bcCanvas, (W-bcDrawWidth)/2, cy, bcDrawWidth, bcDrawHeight);
  cy += bcDrawHeight + 10;

  return cy - y;
}

function buildLayoutCanvas(layout, receiptNo, guestName){
  const W=PRINTER_WIDTH_DOTS, margin=24, gap=18;
  const footerH = 95 + (guestName ? 34 : 0); // reserved space for name+order+barcode
  const H=(layout==='strip'?1040:layout==='receipt'?850:layout==='minimal'?720:760) + footerH;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#000';ctx.textAlign='center';

  if(layout==='portrait'){
    ctx.font='bold 28px Arial';ctx.fillText('PHOTO BOOTH',W/2,40);
    drawFitImage(ctx,lastShot,margin,60,W-margin*2,590);
    ctx.font='20px Arial';ctx.fillText(new Date().toLocaleDateString(),W/2,690);
    ctx.font='bold 20px Arial';ctx.fillText('THANKS FOR VISITING!',W/2,725);
    drawReceiptFooter(ctx, W, 750, receiptNo, guestName);
  }else if(layout==='strip'){
    ctx.font='bold 28px Arial';ctx.fillText('PHOTO BOOTH',W/2,38);
    const boxW=W-margin*2,boxH=285;
    for(let i=0;i<3;i++) drawFitImage(ctx,lastShot,margin,55+i*(boxH+gap),boxW,boxH);
    ctx.font='bold 20px Arial';ctx.fillText('THANKS FOR VISITING!',W/2,1040-25);
    drawReceiptFooter(ctx, W, 1040, receiptNo, guestName);
  }else if(layout==='receipt'){
    ctx.font='bold 30px Arial';ctx.fillText('*** PHOTO BOOTH ***',W/2,40);
    ctx.font='19px Arial';ctx.fillText(new Date().toLocaleString(),W/2,72);
    ctx.fillRect(margin,92,W-margin*2,3);
    drawFitImage(ctx,lastShot,margin,110,W-margin*2,575);
    ctx.fillRect(margin,705,W-margin*2,3);
    ctx.font='bold 22px Arial';ctx.fillText('SMILE! THANKS FOR VISITING',W/2,745);
    ctx.font='18px Arial';ctx.fillText('YOUR PHOTO MEMORY',W/2,780);
    drawReceiptFooter(ctx, W, 800, receiptNo, guestName);
  }else{
    // Minimal: photo stays the star; only a small barcode strip at
    // the very bottom, no name/order text, to keep the look clean.
    drawFitImage(ctx,lastShot,0,0,W,720);
    const bcCanvas = drawBarcode(String(receiptNo).padStart(6,'0'));
    const bcW = 220, bcH = bcCanvas.height * (bcW/bcCanvas.width);
    ctx.drawImage(bcCanvas, (W-bcW)/2, 730, bcW, bcH);
  }
  return c;
}

function drawThumb(id,layout){
  const thumb=$(id);
  const previewNo = peekReceiptNumber();
  const preview=buildLayoutCanvas(layout, previewNo, guestNameInput.value.trim());
  const scale=Math.min(190/preview.width,240/preview.height);
  thumb.width=Math.round(preview.width*scale);
  thumb.height=Math.round(preview.height*scale);
  thumb.getContext('2d').drawImage(preview,0,0,thumb.width,thumb.height);
}
function drawLayoutThumbs(){
  drawThumb('thumbPortrait','portrait');drawThumb('thumbStrip','strip');
  drawThumb('thumbReceipt','receipt');drawThumb('thumbMinimal','minimal');
}
guestNameInput.addEventListener('input', () => drawLayoutThumbs());

document.querySelectorAll('.layoutCard').forEach(card=>{
  card.onclick=()=>{
    selectedLayout=card.dataset.layout;
    document.querySelectorAll('.layoutCard').forEach(c=>c.classList.toggle('selected',c===card));
  };
});
layoutRetakeBtn.onclick=()=>{hideLayoutChooser();retakeBtn.click();};
layoutPrintBtn.onclick=async()=>{hideLayoutChooser();await doPrint();};

mainBtn.onclick=async()=>{await runCountdownAndCapture();};

retakeBtn.onclick=()=>{
  hideLayoutChooser();$('snapCanvas').style.display='none';$('video').style.display='block';
  retakeBtn.classList.add('hidden');mainBtn.textContent='TAKE PHOTO';mainBtn.dataset.mode='';
};

async function runCountdownAndCapture(){
  if(!stream){toast('Start the camera first');return;}
  mainBtn.disabled=true;
  const cd=$('countdown');cd.style.display='flex';
  for(const n of ['3','2','1']){cd.textContent=n;await new Promise(r=>setTimeout(r,700));}
  cd.style.display='none';

  $('flash').style.transition='none';$('flash').style.opacity='1';
  setTimeout(()=>{$('flash').style.transition='opacity .4s';$('flash').style.opacity='0';},60);

  const video=$('video'),canvas=$('snapCanvas');
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0);
  lastShot=canvas;

  video.style.display='none';canvas.style.display='block';retakeBtn.classList.remove('hidden');
  mainBtn.textContent='CHOOSE LAYOUT';mainBtn.dataset.mode='layout';mainBtn.disabled=false;
  showLayoutChooser();
}

async function doPrint(){
  if(!lastShot){toast('Take a photo first');return;}
  if(!bleChar){toast('Connect the printer first');return;}
  mainBtn.disabled=true;layoutPrintBtn.disabled=true;layoutPrintBtn.textContent='PRINTING…';
  try{
    const receiptNo = nextReceiptNumber();
    const guestName = guestNameInput.value.trim();
    const layoutCanvas=buildLayoutCanvas(selectedLayout, receiptNo, guestName);
    const dithered=prepareReceiptImage(layoutCanvas,PRINTER_WIDTH_DOTS);
    const imgBytes=ditheredToEscposBytes(dithered,PRINTER_WIDTH_BYTES);
    let payload=[];
    payload=payload.concat(escposInit(),escposAlignCenter());
    payload=payload.concat(escposRasterHeader(PRINTER_WIDTH_BYTES,dithered.height));
    payload=payload.concat(imgBytes,escposFeed(4));
    await printerWrite(payload);toast('Printed! #'+String(receiptNo).padStart(6,'0'));
  }catch(e){toast('Print failed: '+e.message,4000);}
  finally{
    layoutPrintBtn.disabled=false;layoutPrintBtn.textContent='PRINT';
    setTimeout(()=>{
      hideLayoutChooser();$('snapCanvas').style.display='none';$('video').style.display='block';
      retakeBtn.classList.add('hidden');mainBtn.textContent='TAKE PHOTO';mainBtn.dataset.mode='';mainBtn.disabled=false;
    },1500);
  }
}

/* Guard: Web Bluetooth / camera need a Chromium browser (Android tablet in kiosk mode). */
if(!navigator.bluetooth){
  statusEl.textContent = 'printer: Web Bluetooth unsupported in this browser';
  statusEl.className = 'bad';
}
</script>
</body>
</html>
